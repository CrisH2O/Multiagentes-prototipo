[project]
name = "multiagentes-prototipo"
version = "0.1.0"
description = "Simulador multiagente de siembra agrícola (Reto John Deere)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.4.6",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "streamlit>=1.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
]
